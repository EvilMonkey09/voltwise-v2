# Production stack using the published GHCR image (after v0.3.1+).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  server:
    image: ghcr.io/evilmonkey09/voltwise-v2:latest
    ports:
      - "25555:25555"
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      VOLTWISE_PORT: "25555"
      VOLTWISE_DATA_DIR: /data
    volumes:
      - voltwise-data:/data
    depends_on:
      - mosquitto

volumes:
  voltwise-data:
