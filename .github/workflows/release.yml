name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('edge-firmware/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: chmod +x tools/build_firmware.sh && ./tools/build_firmware.sh
      - name: Package release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for env in esp32dev wt32-eth01 simulation; do
            cp "firmware-artifacts/release/firmware-${env}.bin" "dist/firmware-${env}.bin"
            cp "firmware-artifacts/release/firmware-${env}-${VERSION}.bin" "dist/" 2>/dev/null || \
              cp "firmware-artifacts/release/firmware-${env}.bin" "dist/firmware-${env}-${VERSION}.bin"
          done
          ls -la dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
