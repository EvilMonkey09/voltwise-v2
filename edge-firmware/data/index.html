<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoltWise Edge</title>
<link rel="stylesheet" href="/voltwise.css">
</head>
<body>
<div class="vw-edge-shell">
    <header class="vw-edge-header">
        <div class="vw-edge-brand">
            <span class="vw-edge-mark">VoltWise</span>
            <span class="vw-edge-sub">Edge</span>
        </div>
        <div class="vw-edge-pills">
            <span id="net-pill" class="vw-edge-pill">—</span>
            <span id="mode-pill" class="vw-edge-pill vw-edge-pill-mode">—</span>
        </div>
    </header>

    <div id="status" class="vw-card vw-kpi-card">
        <span class="vw-kpi-label">Gesamtleistung</span>
        <span class="vw-kpi-value" id="total-p">—</span>
    </div>

    <div class="vw-card">
        <table class="vw-table" id="tbl">
            <thead><tr><th>Phase</th><th>U</th><th>I</th><th>P</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="vw-edge-actions">
        <a class="vw-btn vw-btn-ghost vw-btn-sm" href="/settings">Einstellungen</a>
        <button type="button" class="vw-btn vw-btn-ghost vw-btn-sm" id="btn-setup">WLAN einrichten</button>
    </div>
    <p id="setup-msg" class="vw-edge-msg vw-muted"></p>
</div>
<script>
async function loadNet(){
  const r=await fetch('/api/network/status');const d=await r.json();
  const pill=document.getElementById('net-pill');
  if(d.captive_portal){pill.textContent='Setup';pill.className='vw-edge-pill vw-edge-pill-setup';}
  else if(d.online){pill.textContent='Online';pill.className='vw-edge-pill vw-edge-pill-online';}
  else{pill.textContent='Offline';pill.className='vw-edge-pill vw-edge-pill-offline';}
  const mode=document.getElementById('mode-pill');
  if(d.mqtt_connected){mode.textContent='Central';mode.className='vw-edge-pill vw-edge-pill-central';}
  else if(d.mqtt_configured){mode.textContent='Central (offline)';mode.className='vw-edge-pill vw-edge-pill-setup';}
  else{mode.textContent='Standalone';mode.className='vw-edge-pill vw-edge-pill-mode';}
}
async function refresh(){
  const r=await fetch('/api/data');const d=await r.json();
  const total=(d.phases||[]).reduce((s,p)=>s+(p.power||0),0);
  document.getElementById('total-p').textContent=total.toFixed(1)+' W';
  const tb=document.querySelector('#tbl tbody');tb.innerHTML='';
  (d.phases||[]).forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="${p.label.toLowerCase()}">${p.label}</td><td>${p.voltage.toFixed(1)} V</td><td>${p.current.toFixed(3)} A</td><td>${p.power.toFixed(1)} W</td>`;
    tb.appendChild(tr);
  });
}
document.getElementById('btn-setup').onclick=async()=>{
  const msg=document.getElementById('setup-msg');
  msg.textContent='Starte Hotspot…';
  const r=await fetch('/api/network/setup-mode',{method:'POST'});
  const j=await r.json();
  if(j.ok){
    msg.textContent='Hotspot '+j.ap_ssid+' aktiv. Mit dem Handy verbinden und Setup-Seite öffnen.';
    if(j.ip) setTimeout(()=>{window.location.href='http://'+j.ip+'/';},1500);
  } else msg.textContent='Setup-Modus konnte nicht gestartet werden.';
};
loadNet();refresh();setInterval(refresh,1000);setInterval(loadNet,5000);
</script>
</body>
</html>
