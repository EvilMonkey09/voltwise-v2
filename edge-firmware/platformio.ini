; VoltWise Edge Firmware — WT32-ETH01 + ESP32-WROOM
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
    4-20ma/ModbusMaster@2.0.1
    mathieucarbou/AsyncTCP@^3.3.2
    mathieucarbou/ESPAsyncWebServer@^3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DVOLTWISE_FW_VERSION=\"0.3.1\"
    -DVOLTWISE_GITHUB_REPO=\"EvilMonkey09/voltwise-v2\"

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WIFI=1
    -DVOLTWISE_BOARD_PROFILE=\"esp32dev\"

[env:wt32-eth01]
board = wt32-eth01
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01=1
    -DVOLTWISE_BOARD_PROFILE=\"wt32-eth01\"

[env:simulation]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WIFI=1
    -DVOLTWISE_SIMULATION=1
    -DVOLTWISE_BOARD_PROFILE=\"simulation\"
